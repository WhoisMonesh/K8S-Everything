apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app: web }
spec:
  selector: { app: web }
  ports:
  - name: http
    port: 80          # cluster-facing port
    targetPort: http  # matches containerPort name: 8080
  type: ClusterIP     # use LoadBalancer / NodePort only when needed (FinOps)
---
# Headless Service (no cluster IP) — used by StatefulSets for stable DNS (pod-0.web.default.svc)
apiVersion: v1
kind: Service
metadata:
  name: web-headless
  labels: { app: web }
spec:
  clusterIP: None
  selector: { app: web }
  ports: [{ port: 80, targetPort: http, name: http }]
