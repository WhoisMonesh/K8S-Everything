apiVersion: v1
kind: ConfigMap
metadata: { name: web-config }
data:
  LOG_LEVEL: "info"            # envFrom maps keys to env vars
  index.html: "<h1>Hello</h1>" # mounted as a file via configMapKeyRef
---
apiVersion: v1
kind: Secret
metadata: { name: web-secret }
type: Opaque
stringData:
  username: admin
  password: "<never-commit-here>"   # store real value in SealedSecrets/External Secrets
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web-env }
spec:
  replicas: 1
  selector: { matchLabels: { app: web-env } }
  template:
    metadata: { labels: { app: web-env } }
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        envFrom:
        - configMapRef: { name: web-config }
        - secretRef:    { name: web-secret }
        env:
        - name: VERSION          # explicit override + configMap-backed
          valueFrom: { configMapKeyRef: { name: web-config, key: LOG_LEVEL } }
        ports: [{ containerPort: 80 }]
