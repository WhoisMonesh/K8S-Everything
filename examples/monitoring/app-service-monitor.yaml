# An app that exposes Prometheus-format metrics on /metrics:
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, labels: { app: api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/port: "8080"        # Prometheus discovers via this (or a ServiceMonitor)
        prometheus.io/path: /metrics
    spec:
      containers:
      - name: api
        image: myorg/api:1.2.3
        ports: [{ containerPort: 8080 }]
        env:
        - { name: METRICS_PORT, value: "8080" }
        resources: { requests: { cpu: 100m, memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api, labels: { app: api } }
spec:
  selector: { app: api }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# ServiceMonitor (Prometheus Operator) — scrapes the Service's endpoints
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: api, labels: { app: api } }
spec:
  selector: { matchLabels: { app: api } }
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: instance
