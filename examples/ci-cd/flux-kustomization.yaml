apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: webapp
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./clusters/production/webapp
  prune: true
  sourceRef:
    kind: GitRepository
    name: webapp
  postBuild:
    substitute:
      cluster_domain: cluster.local
    substituteFrom:
    - kind: Secret
      name: cluster-settings
      optional: true
