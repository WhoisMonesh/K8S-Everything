apiVersion: autoscaling/v2        # v2 supports Resource / Pods / External / ContainerResource
kind: HorizontalPodAutoscaler
metadata: { name: web }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
  - type: External            # e.g. custom metric from Prometheus external-metrics API
    external:
      metric: { name: http_requests_per_second }
      target: { type: Value, value: "500" }
  behavior:                    # hysteresis to avoid flapping
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Percent, value: 10, periodSeconds: 60 }] }
    scaleUp:   { stabilizationWindowSeconds: 60,  policies: [{ type: Percent, value: 50, periodSeconds: 60 }] }
