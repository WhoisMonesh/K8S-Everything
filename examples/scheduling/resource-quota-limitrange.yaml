apiVersion: v1
kind: Namespace
metadata:
  name: team-a
  labels: { cost-team: "platform", environment: prod }   # FinOps allocation label
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: compute }
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    requests.storage: 100Gi
    count/persistentvolumeclaims: "10"
    count/jobs: "5"
---
apiVersion: v1
kind: LimitRange
metadata: { name: defaults }
spec:
  limits:
  - type: Container
    defaultRequest: { cpu: 100m, memory: 128Mi }
    default:        { cpu: 250m, memory: 256Mi }
    max: { memory: 2Gi }
    min: { memory: 32Mi, cpu: 20m }
